  <rect x="48" y="492" width="34" height="18" rx="2" fill="#1e8449"/><text x="65" y="505" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">IRT</text>
  <rect x="380" y="616" width="34" height="18" rx="2" fill="#1e8449"/><text x="397" y="629" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">IRT</text>
  <rect x="420" y="613" width="24" height="24" rx="3" fill="#1e8449"/><text x="432" y="631" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">+</text>
  <rect x="258" y="614" width="26" height="20" rx="3" fill="#c0392b"/><text x="271" y="628" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">SU</text>
