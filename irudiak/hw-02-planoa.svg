    <rect x="586" y="112" width="108" height="22" rx="2" fill="#ff4500"/><text x="640" y="127" fill="#fff" font-weight="700">Router / Firewall</text>
    <rect x="586" y="138" width="108" height="22" rx="2" fill="#4a4a4a"/><text x="640" y="153" fill="#fff">Switch 24p PoE+</text>
    <rect x="586" y="164" width="108" height="22" rx="2" fill="#4a4a4a"/><text x="640" y="179" fill="#fff">Patch panel 24p</text>
    <rect x="586" y="190" width="108" height="22" rx="2" fill="#6b5a7d"/><text x="640" y="205" fill="#fff">Zerbitzari fisikoa</text>
    <rect x="586" y="216" width="108" height="22" rx="2" fill="#6b5a7d"/><text x="640" y="231" fill="#fff">NAS (babeskopiak)</text>
    <rect x="586" y="242" width="108" height="26" rx="2" fill="#3a6b45"/><text x="640" y="259" fill="#fff">SAI 1500VA</text>
