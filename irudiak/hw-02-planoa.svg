    <rect x="793" y="146" width="24" height="18" rx="3" fill="#c0392b"/><text x="805" y="159" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">SU</text><text x="830" y="160">Su-itzalgailua (CO2)</text>
    <polygon points="805,172 818,194 792,194" fill="#ffcc00" stroke="#333"/><text x="805" y="191" text-anchor="middle" font-size="11" font-weight="700">!</text><text x="830" y="189">Arrisku elektrikoa</text>
    <rect x="794" y="202" width="22" height="22" rx="3" fill="#1e8449"/><text x="805" y="219" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">+</text><text x="830" y="218">Lehen sorospenak</text>
    <circle cx="805" cy="245" r="12" fill="#1f4e9c"/><text x="805" y="248" text-anchor="middle" font-size="8" font-weight="700" fill="#fff">ESD</text><text x="830" y="243">Eskumuturreko antiestatikoa</text><text x="830" y="257">derrigorrezkoa</text>
    <g transform="translate(805,282)"><circle r="11" fill="#fff" stroke="#c0392b" stroke-width="3"/><line x1="-8" y1="-8" x2="8" y2="8" stroke="#c0392b" stroke-width="3"/></g><text x="830" y="286">Debekatuta jan eta edan</text>
    <g transform="translate(798,302)"><rect x="0" y="6" width="14" height="11" rx="2" fill="#5d4a6e"/><path d="M3,6 V3 A4,4 0 0,1 11,3 V6" fill="none" stroke="#5d4a6e" stroke-width="2"/></g><text x="830" y="316">Sarbide mugatua (IT soilik)</text>
  </g>

  <text x="790" y="360" font-size="15" font-weight="700" fill="#0f0f0f">Hondakinak</text>
  <g font-size="12" fill="#333">
    <rect x="792" y="374" width="22" height="16" rx="2" fill="#f2c94c" stroke="#555"/><text x="824" y="387">RAEE: ekipo eta osagai zaharrak</text>
    <rect x="792" y="400" width="22" height="16" rx="2" fill="#e67e22" stroke="#555"/><text x="824" y="413">Pilak eta bateriak</text>
    <rect x="792" y="426" width="22" height="16" rx="2" fill="#8e9aa3" stroke="#555"/><text x="824" y="439">Metala (torlojuak, txasisak)</text>
    <rect x="792" y="452" width="22" height="16" rx="2" fill="#fff3c4" stroke="#555"/><text x="824" y="465">Plastikoa eta ontziak</text>
    <rect x="792" y="478" width="22" height="16" rx="2" fill="#4a4a4a" stroke="#555"/><text x="824" y="491">Hondakin arruntak</text>
  </g>

