    <rect x="792" y="575" width="22" height="16" rx="2" fill="#f1ecf7" stroke="#5d4a6e"/><text x="824" y="588">Ekipo-gela (rack-a)</text>
    <rect x="792" y="601" width="22" height="16" rx="2" fill="#fff4ec" stroke="#ff4500"/><text x="824" y="614">Proba-mahaia</text>
    <rect x="792" y="627" width="22" height="16" rx="2" fill="#f3ead9" stroke="#9c7b45"/><text x="824" y="640">Biltegia eta tresnak</text>
