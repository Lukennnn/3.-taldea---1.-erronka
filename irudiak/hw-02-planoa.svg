  <text x="731" y="221" text-anchor="middle" font-size="12" font-weight="700" fill="#333">!</text>
  <rect x="718" y="234" width="26" height="20" rx="3" fill="#c0392b"/><text x="731" y="248" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">SU</text>
  <text x="528" y="100" font-size="11" font-weight="700" fill="#5d4a6e">Ekipo-gela</text>
