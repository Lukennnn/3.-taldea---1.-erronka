    <rect x="270" y="120" width="160" height="80" rx="4" fill="#e8f1fb" stroke="#5b84b1" stroke-width="1.5"/>
    <text x="350" y="157" font-weight="600" fill="#2c4a6b">Lan-mahaia 2</text><text x="350" y="174" font-size="10" fill="#5b6b7b">ESD alfonbra</text>
    <rect x="70" y="250" width="160" height="80" rx="4" fill="#e8f1fb" stroke="#5b84b1" stroke-width="1.5"/>
    <text x="150" y="287" font-weight="600" fill="#2c4a6b">Lan-mahaia 3</text><text x="150" y="304" font-size="10" fill="#5b6b7b">ESD alfonbra</text>
    <rect x="270" y="250" width="160" height="80" rx="4" fill="#e8f1fb" stroke="#5b84b1" stroke-width="1.5"/>
    <text x="350" y="287" font-weight="600" fill="#2c4a6b">Lan-mahaia 4</text><text x="350" y="304" font-size="10" fill="#5b6b7b">ESD alfonbra</text>
