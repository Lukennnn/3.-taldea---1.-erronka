    <rect x="588" y="485" width="44" height="44" rx="3" fill="#8e9aa3" stroke="#555"/><text x="610" y="511" fill="#fff">Metala</text>
    <rect x="637" y="485" width="44" height="44" rx="3" fill="#fff3c4" stroke="#555"/><text x="659" y="511" fill="#333">Plastik.</text>
    <rect x="686" y="485" width="44" height="44" rx="3" fill="#4a4a4a" stroke="#555"/><text x="708" y="511" fill="#fff">Arrunt.</text>
  </g>
  <text x="610" y="555" text-anchor="middle" font-size="10" fill="#2e6b3e">Gestore baimendua: Ecolec / Ecotic</text>
  <text x="610" y="571" text-anchor="middle" font-size="10" fill="#2e6b3e">Datuak ezabatu entregatu aurretik</text>

