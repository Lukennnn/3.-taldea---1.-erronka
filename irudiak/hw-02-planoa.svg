<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="1100" height="720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1100" height="720" fill="#ffffff"/>

  <!-- Izenburua -->
  <text x="40" y="44" font-size="22" font-weight="700" fill="#0f0f0f">TungTunning · Informatika tailerraren planoa</text>
  <rect x="40" y="54" width="70" height="3" fill="#ff4500"/>

  <!-- Gelaren zorua -->
  <rect x="40" y="80" width="720" height="570" fill="#fafaf8"/>

  <!-- Ekipo-gela (IT soilik) -->
  <rect x="520" y="80" width="240" height="220" fill="#f1ecf7"/>

  <!-- Hormak -->
  <rect x="40" y="80" width="720" height="570" fill="none" stroke="#222" stroke-width="6"/>
  <line x1="520" y1="80" x2="520" y2="300" stroke="#222" stroke-width="4"/>
  <line x1="520" y1="300" x2="760" y2="300" stroke="#222" stroke-width="4"/>
  <!-- Hutsuneak (ateak) -->
  <rect x="300" y="645" width="70" height="10" fill="#ffffff"/>
  <rect x="35" y="520" width="10" height="55" fill="#ffffff"/>
  <rect x="540" y="297" width="50" height="6" fill="#fafaf8"/>

  <!-- Ateak -->
