    <path d="M300,600 A50,50 0 0,1 350,650"/>
    <line x1="40" y1="520" x2="90" y2="520"/>
    <path d="M90,520 A50,50 0 0,1 40,570"/>
    <line x1="540" y1="300" x2="540" y2="345"/>
    <path d="M540,345 A45,45 0 0,0 585,300"/>
