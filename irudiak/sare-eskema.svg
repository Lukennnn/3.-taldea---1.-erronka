<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" width="900" height="510" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="900" height="510" fill="#ffffff"/>

  <!-- Servidor Proxmox -->
  <rect x="50" y="235" width="800" height="250" rx="10" fill="#f3eefa" stroke="#9673a6" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="70" y="260" font-size="13" font-weight="bold" fill="#6a4a7a">Servidor Proxmox</text>
  <text x="70" y="276" font-size="10" fill="#8a6f96">Máquinas virtuales</text>

  <!-- Conexiones -->
  <g stroke="#555" stroke-width="1.5" fill="none">
    <line x1="450" y1="100" x2="450" y2="148" marker-end="url(#a)"/>
    <line x1="450" y1="200" x2="450" y2="278" marker-end="url(#a)"/>
    <polyline points="450,330 450,365"/>
    <polyline points="135,365 765,365"/>
    <line x1="135" y1="365" x2="135" y2="393" marker-end="url(#a)"/>
    <line x1="290" y1="365" x2="290" y2="393" marker-end="url(#a)"/>
    <line x1="450" y1="365" x2="450" y2="393" marker-end="url(#a)"/>
    <line x1="610" y1="365" x2="610" y2="393" marker-end="url(#a)"/>
    <line x1="765" y1="365" x2="765" y2="393" marker-end="url(#a)"/>
  </g>

  <!-- Internet -->
  <path d="M415,98 C390,98 385,70 405,64 C400,40 435,30 448,45 C458,22 498,25 500,52 C525,50 530,85 508,92 C505,100 495,98 490,98 Z" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="455" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Internet</text>

  <!-- Router -->
  <rect x="380" y="150" width="140" height="50" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="450" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Router</text>

  <!-- Firewall -->
  <rect x="330" y="280" width="240" height="50" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
  <text x="450" y="302" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Firewall</text>
  <text x="450" y="319" text-anchor="middle" font-size="10" fill="#7a3b38">pfSense</text>

  <!-- Servicios -->
  <g fill="#fff" stroke="#666" stroke-width="1.2">
    <rect x="70" y="395" width="130" height="60" rx="8"/>
    <rect x="225" y="395" width="130" height="60" rx="8"/>
    <rect x="380" y="395" width="140" height="60" rx="8"/>
    <rect x="545" y="395" width="130" height="60" rx="8"/>
    <rect x="700" y="395" width="130" height="60" rx="8"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="bold" fill="#222">
    <text x="135" y="422">Jitsi</text>
    <text x="290" y="422">WordPress</text>
    <text x="450" y="422">GLPI</text>
    <text x="610" y="422">CUPS</text>
    <text x="765" y="422">Windows Server</text>
  </g>
  <g text-anchor="middle" font-size="10" fill="#666">
    <text x="135" y="439">Videoconferencia</text>
    <text x="290" y="439">Servidor web</text>
    <text x="450" y="439">Gestión de incidencias</text>
    <text x="610" y="439">Servidor de impresión</text>
    <text x="765" y="439">Dominio / AD</text>
  </g>
</svg>
